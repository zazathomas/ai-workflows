[project]
name = "agentic-coding"
version = "0.1.0"
description = "Standalone state-machine CLI for Agentic Coding workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zaza Thomas" }]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "filelock>=3.14.0",
]

[project.scripts]
agentic = "agentic_coding.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "build>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_coding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
